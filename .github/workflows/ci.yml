name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install, audit and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high
          npm run lint
          npm run build

      - name: Install Qt runtime libraries (headless PyQt6 import/offscreen support)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-cov ruff

      - name: Lint with Ruff
        run: |
          ruff check broast_pos tests --select F,E9,I

      - name: Run tests
        env:
          PYTHONPATH: .
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest -v --cov=broast_pos

      - name: Run real React to Qt bridge workflows
        env:
          PYTHONPATH: .
          QT_QPA_PLATFORM: offscreen
          POS_RUN_RENDERED_TESTS: '1'
          QTWEBENGINE_DISABLE_SANDBOX: '1'
          QTWEBENGINE_CHROMIUM_FLAGS: '--disable-gpu --no-sandbox --disable-dev-shm-usage'
        run: pytest -v tests/test_visible_cash_workflow.py tests/test_visible_flows_extended.py
